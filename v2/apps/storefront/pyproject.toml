[project]
name = "storefront"
version = "0.1.0"
description = "Multi-service workload of volume 2 of the devops-delivery handbook (a teaching system, not business software)."
requires-python = ">=3.13"
# Dependencies are pinned in requirements*.txt (compiled with uv); see requirements.in.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: needs PostgreSQL, Valkey and NATS (compose.test.yaml)"]

[tool.coverage.run]
source = ["storefront"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S104"]  # services bind 0.0.0.0 inside their container on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S105"]
