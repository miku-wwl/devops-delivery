# Unit and integration tests with real dependencies, the same way locally and in CI:
#   docker compose -f compose.test.yaml run --rm --build tests
#   docker compose -f compose.test.yaml down -v
name: storefront-test
services:
  postgres:
    image: postgres:18.6
    environment: {POSTGRES_PASSWORD: test}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30}
  valkey:
    image: valkey/valkey:9.1.3
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, retries: 30}
  nats:
    image: nats:2.15.2
    command: ["-js", "-m", "8222"]
  tests:
    build: {context: ., target: test}
    environment:
      TEST_PG_URL: postgresql://postgres:test@postgres:5432
      TEST_VALKEY_URL: redis://valkey:6379/0
      TEST_NATS_URL: nats://nats:4222
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_started}
