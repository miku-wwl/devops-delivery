# E5: per-tenant guard rails, owned by the platform (tenants can read them, not change them).
# Quota: totals for the namespace. LimitRange: defaults for containers that state nothing -
# memory gets a default limit; CPU gets a default request and no limit, and there is no max.cpu,
# because a max without a default limit becomes everyone's CPU limit (chapter 5, experiment 8).
# Network isolation: network.yaml (added after the baseline was measured, chapter 6).
apiVersion: v1
kind: ResourceQuota
metadata: {name: tenant, namespace: shop-dev}
spec:
  hard: {pods: "10", requests.cpu: "1", requests.memory: 768Mi, limits.memory: 1536Mi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: tenant-defaults, namespace: shop-dev}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 128Mi}
      max: {memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: tenant, namespace: insight}
spec:
  hard: {pods: "10", requests.cpu: "1", requests.memory: 768Mi, limits.memory: 1536Mi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: tenant-defaults, namespace: insight}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 128Mi}
      max: {memory: 512Mi}
