# E5: the tenants' namespaces. "storefront" (prod, GitOps only) belongs to team-shop as well and is
# defined in ../namespaces/. shop-dev: team-shop's own development namespace; insight: a second
# team. Pod Security Admission enforces the "restricted" profile (non-root, no privilege
# escalation, all capabilities dropped, seccomp). Delete=false: removing this file must never
# delete a team's namespace and everything in it.
apiVersion: v1
kind: Namespace
metadata:
  name: shop-dev
  annotations: {argocd.argoproj.io/sync-options: Delete=false}
  labels:
    tenant: shop
    tenant-defaults: git   # E8: quota, LimitRange, NetworkPolicies from Git, not from Kyverno
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: insight
  annotations: {argocd.argoproj.io/sync-options: Delete=false}
  labels:
    tenant: insight
    tenant-defaults: git   # E8: quota, LimitRange, NetworkPolicies from Git, not from Kyverno
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
