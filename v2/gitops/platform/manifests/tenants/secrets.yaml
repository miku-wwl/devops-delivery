# E5: secrets from OpenBao, per tenant (chapter 6). Each tenant namespace has a service account
# "secrets-reader" and a SecretStore that logs in to OpenBao with it (Kubernetes auth): OpenBao
# binds the role "insight" to insight/secrets-reader and the role "shop" to shop-dev/secrets-reader,
# each with read access to its own path only (platform/secrets/openbao-init.sh). The stores are the
# platform's; a team decides which secrets to copy (ExternalSecret).
apiVersion: v1
kind: ServiceAccount
metadata: {name: secrets-reader, namespace: insight}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: secrets-reader, namespace: shop-dev}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: openbao, namespace: insight}
spec:
  provider:
    vault:
      server: http://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes: {mountPath: kubernetes, role: insight, serviceAccountRef: {name: secrets-reader}}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: openbao, namespace: shop-dev}
spec:
  provider:
    vault:
      server: http://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes: {mountPath: kubernetes, role: shop, serviceAccountRef: {name: secrets-reader}}
---
# Only the External Secrets Operator may connect to OpenBao (both sides in the mesh: the traffic
# arrives on 15008, so the whole namespace is allowed, every port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: secrets}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-external-secrets, namespace: secrets}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: external-secrets}}}]
---
# E9 (chapter 10): Prometheus (namespace monitoring, outside the mesh) scrapes OpenBao's metrics on
# the application port; a NetworkPolicy cannot narrow it to the path /v1/sys/metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-prometheus-metrics, namespace: secrets}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
      ports: [{port: 8200, protocol: TCP}]
