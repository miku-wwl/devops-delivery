# Wave 1: one Application per service and environment, generated from the files
# envs/<env>/storefront/services/<service>.yaml. Adding a service = adding a file.
# Namespace: "storefront" for prod, "storefront-<env>" otherwise (E8 adds staging).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storefront
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://gitlab:8929/root/platform-gitops.git
        revision: main
        files:
          - path: "envs/*/storefront/services/*.yaml"
  template:
    metadata:
      name: 'storefront-{{ .service }}-{{ index .path.segments 1 }}'
      labels:
        storefront/env: '{{ index .path.segments 1 }}'
        storefront/service: '{{ .service }}'
      annotations:   # E8: deployment events to GitLab (gitops/bootstrap/argocd-values.yaml notifications)
        notifications.argoproj.io/subscribe.on-deployed.gitlab-deployments: ""
        notifications.argoproj.io/subscribe.on-sync-failed.gitlab-deployments: ""
    spec:
      project: storefront
      source:
        repoURL: http://gitlab:8929/root/platform-gitops.git
        targetRevision: main
        path: charts/storefront-service
        helm:
          releaseName: '{{ .service }}'
          valueFiles:
            - '../../envs/{{ index .path.segments 1 }}/storefront/common.yaml'
            - '../../{{ .path.path }}/{{ .path.filename }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ if eq (index .path.segments 1) "prod" }}storefront{{ else }}storefront-{{ index .path.segments 1 }}{{ end }}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        # E8 (chapter 9): no CreateNamespace=true - the namespaces are the platform's (platform/manifests/
        # namespaces, tenants); with sync impersonation the option would read the namespace with the
        # team's deployer account, which has no rights outside it (hypothesis I5)
        retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
