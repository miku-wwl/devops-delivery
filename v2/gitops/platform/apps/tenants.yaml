# E5: the tenants' namespaces, RBAC and guard rails - owned by the platform team. Wave -2, before
# the workloads. Pruning removes RBAC objects deleted from Git; the namespaces carry Delete=false.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenants
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  project: platform
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: platform/manifests/tenants
  destination: {server: "https://kubernetes.default.svc"}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
# Team insight's workloads, through the restricted project "insight" (00-projects.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: insight
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  project: insight
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: tenants/insight
  destination: {server: "https://kubernetes.default.svc", namespace: insight}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
