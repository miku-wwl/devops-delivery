# Wave -3: its CRDs (ServiceMonitor, PodMonitor, PrometheusRule) are used by everything after it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.22.0
      helm:
        releaseName: kps
        valueFiles: [$values/platform/values/monitoring.yaml]
    - {repoURL: "http://gitlab:8929/root/platform-gitops.git", targetRevision: main, ref: values}
  destination: {server: "https://kubernetes.default.svc", namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
