# Wave -3: Kyverno (admission policy, E5 / chapter 6). Its CRDs (ClusterPolicy) must exist before
# the "policies" application (wave -2) uses them. Server-side apply: the CRDs are too large for
# the last-applied-configuration annotation of a client-side apply (as with KEDA).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  project: platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.2
      helm: {releaseName: kyverno, valueFiles: [$values/platform/values/kyverno.yaml]}
    - {repoURL: "http://gitlab:8929/root/platform-gitops.git", targetRevision: main, ref: values}
  destination: {server: "https://kubernetes.default.svc", namespace: kyverno}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
