# Wave -2 (E8: was -1): the platform's admission policies (E5 / chapter 6), two ClusterPolicies,
# after Kyverno (wave -3) and before the storefront (wave -1). SkipDryRunOnMissingResource: on a
# fresh cluster the ClusterPolicy CRD appears only when Kyverno is installed in the same sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  project: platform
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: platform/manifests/policies
  destination: {server: "https://kubernetes.default.svc"}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
