# Wave -3: secret management (E5 / chapter 6) - OpenBao (the store) and the External Secrets
# Operator (copies values from the store into Kubernetes Secrets). Both namespaces join the
# ambient mesh: OpenBao listens without TLS, and ztunnel encrypts the traffic between them (mTLS).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  project: platform
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.7
      helm: {releaseName: openbao, valueFiles: [$values/platform/values/openbao.yaml]}
    - {repoURL: "http://gitlab:8929/root/platform-gitops.git", targetRevision: main, ref: values}
  destination: {server: "https://kubernetes.default.svc", namespace: secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels: {istio.io/dataplane-mode: ambient}
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm: {releaseName: external-secrets, valueFiles: [$values/platform/values/external-secrets.yaml]}
    - {repoURL: "http://gitlab:8929/root/platform-gitops.git", targetRevision: main, ref: values}
  destination: {server: "https://kubernetes.default.svc", namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels: {istio.io/dataplane-mode: ambient}
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
