# E9 (chapter 10): the platform's alert rules and the storefront's SLO rules (generated by
# platform/slo/gen.py). Wave -2: after kube-prometheus-stack (wave -3) has installed the CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerts
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  project: platform
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: platform/manifests/alerts
  destination: {server: "https://kubernetes.default.svc"}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
