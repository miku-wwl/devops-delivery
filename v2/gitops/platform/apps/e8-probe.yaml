# E8 (chapter 9), temporary: an application of the project "storefront" that writes a Secret into its
# namespace - allowed by the project (every core kind), applied with which rights? No finalizer: its
# Secret is removed by hand afterwards (with impersonation the deployer account may not delete it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e8-probe
  namespace: argocd
spec:
  project: storefront
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: e8-probe
  destination: {server: "https://kubernetes.default.svc", namespace: storefront}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
# E8 (chapter 9), temporary: the same, with CreateNamespace=true and a ConfigMap (a kind the deployer
# account may write) - what that sync option needs under impersonation (hypothesis I5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e8-probe-ns
  namespace: argocd
spec:
  project: storefront
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: e8-probe-ns
  destination: {server: "https://kubernetes.default.svc", namespace: storefront}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
