# Wave -3: KEDA (event-driven autoscaling, E4 / chapter 5). Its CRDs (ScaledObject) must exist
# before the storefront applications (wave 1) use them. Server-side apply: the KEDA CRDs are too
# large for the last-applied-configuration annotation of a client-side apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  project: platform
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.0
      helm: {releaseName: keda, valueFiles: [$values/platform/values/keda.yaml]}
    - {repoURL: "http://gitlab:8929/root/platform-gitops.git", targetRevision: main, ref: values}
  destination: {server: "https://kubernetes.default.svc", namespace: keda}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
