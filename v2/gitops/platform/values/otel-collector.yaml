# opentelemetry-collector 0.178.2: one gateway collector. Services send OTLP/HTTP; traces go to
# Tempo, logs to Loki (native OTLP). Metrics stay on the Prometheus scrape path.
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image: {repository: otel/opentelemetry-collector-contrib}
resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 384Mi}}
presets:
  kubernetesAttributes: {enabled: true}   # k8s.pod.name, k8s.deployment.name, ... on every span
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}
serviceMonitor: {enabled: true}
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  exporters:
    otlp/tempo:
      endpoint: tempo.observability:4317
      tls: {insecure: true}
    otlphttp/loki:
      endpoint: http://loki.observability:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]
      metrics: null
