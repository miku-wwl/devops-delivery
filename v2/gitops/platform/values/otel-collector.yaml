# opentelemetry-collector 0.178.2: one gateway collector. Services send OTLP/HTTP; traces go to
# Tempo, logs to Loki (native OTLP). Metrics stay on the Prometheus scrape path.
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image: {repository: otel/opentelemetry-collector-contrib}
resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 384Mi}}
presets:
  kubernetesAttributes: {enabled: true}   # k8s.pod.name, k8s.deployment.name, ... on every span
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}
serviceMonitor: {enabled: true}
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # E9 (chapter 10): tail sampling - the decision waits until a trace is complete (10 s) and keeps
    # every trace with an error, every trace slower than 1 s, and 10 % of the rest. One replica: all
    # spans of a trace must reach the same collector (more replicas need routing by trace ID).
    tail_sampling:
      decision_wait: 10s
      num_traces: 20000
      expected_new_traces_per_sec: 100
      policies:
        - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
        - {name: slow, type: latency, latency: {threshold_ms: 1000}}
        - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: 10}}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability:4317
      tls: {insecure: true}
    otlphttp/loki:
      endpoint: http://loki.observability:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, tail_sampling, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]
      metrics: null
