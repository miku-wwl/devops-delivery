# cert-manager v1.21.3 (2026-10-23), E7: issues the mutual-TLS certificates between the
# CloudNativePG operator and the Barman Cloud plugin. Requests from the chart's idle footprint.
crds: {enabled: true, keep: true}
resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 192Mi}}
webhook:
  resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {memory: 96Mi}}
cainjector:
  resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 192Mi}}
# a post-install Job that only waits for the webhook; Argo CD's health checks do that already
startupapicheck: {enabled: false}
