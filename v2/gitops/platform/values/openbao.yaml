# openbao 0.30.7 = OpenBao v2.7.2 (released 2026-10-26), E5 / chapter 6. One server with integrated
# storage (raft, one node) on a volume - the first try used "file", which OpenBao 2 no longer has
# ("unknown storage type file"). Initialised and unsealed by platform/secrets/openbao-init.sh (one
# key share, kept in ~/.lab-secrets/v2/openbao - production: several shares, or auto-unseal with a
# KMS). After every restart the server is sealed until someone unseals it. No TLS on the listener:
# the namespace is in the ambient mesh (mTLS by ztunnel) and only the External Secrets namespace
# may connect.
injector: {enabled: false}
ui: {enabled: false}
server:
  priorityClassName: platform-critical   # E7: pinned to its volume (chapter 7, incident 2)
  resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
  authDelegator: {enabled: true}   # TokenReview for the Kubernetes auth method
  dataStorage: {enabled: true, size: 1Gi}
  auditStorage: {enabled: false}   # the audit device writes to stdout (kubectl logs)
  standalone:
    enabled: true
    config: |
      ui = false
      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }
      storage "raft" {
        path = "/openbao/data"
      }
      cluster_addr = "http://POD_IP:8201"
      # OpenBao 2.7 refuses to enable audit devices through the API (an attacker with a token
      # could redirect the audit trail); they are declared here. stdout: kubectl logs.
      audit "file" "stdout" {
        description = "every request and response, secret values HMAC-ed"
        options {
          file_path = "stdout"
        }
      }
