# grafana/loki 7.5.0 in single-binary mode on the local filesystem. The chart's defaults for a
# scalable install (gateway, memcached caches - the chunk cache alone asks for GBs -, canary,
# read/write/backend replicas) are switched off: they do not fit the budget of chapter 1.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    retention_period: 24h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester: {enabled: false}
singleBinary:
  replicas: 1
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 768Mi}}
  persistence: {size: 2Gi}
sidecar:
  rules: {enabled: false}            # no Loki alerting rules here; the sidecar alone used 71 MiB
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
