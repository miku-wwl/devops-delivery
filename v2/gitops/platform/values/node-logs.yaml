# fluent-bit 0.58.3 = Fluent Bit 5.1.3, E9 (chapter 10): node-level log collection. Until now Loki held
# only what the services send over OTLP; the standard output of every other container - and of a pod
# that is evicted or deleted - was gone with the pod (chapter 5: the evicted pods' last lines could not
# be read). One small pod per node tails /var/log/containers and pushes to Loki (label job=node-logs).
image: {repository: docker.io/fluent/fluent-bit}   # the chart's cr.fluentbit.io is not mirrored here
resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
tolerations: [{operator: Exists}]   # every node, the control plane included
serviceMonitor: {enabled: true}
config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5   # E9 (L1): new files every 5 s, not 60 - a short-lived pod's file may be gone by then
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           Off
        Labels              Off
        Annotations         Off
  outputs: |
    [OUTPUT]
        Name         loki
        Match        kube.*
        Host         loki.observability
        Port         3100
        labels       job=node-logs, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], node=$kubernetes['host']
        remove_keys  kubernetes, stream, _p
        line_format  json
        drop_single_key raw
