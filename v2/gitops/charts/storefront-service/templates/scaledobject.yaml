{{- if .Values.keda.enabled }}
# Event-driven autoscaling (E4): KEDA reads the triggers every pollingInterval seconds and feeds
# them as an external metric to the HPA it owns (keda-hpa-<service>).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "svc.name" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "svc.name" . }}
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers: {{- toYaml .Values.keda.triggers | nindent 4 }}
{{- end }}
