service: gateway-canary
app: gateway
# E8 (chapter 9): the next gateway version as a canary - the same configuration as gateway.yaml,
# without autoscaler and load balancer, with its own image. Its share of the public traffic is the
# weight of "gateway-canary" in the HTTPRoute storefront (platform/manifests/mesh/ingress-storefront.yaml).
replicas: 2
image: {tag: "8ef5584"}
resources:
  requests: {cpu: 500m}
env:
  CATALOG_URL: http://catalog:8080
  ORDERS_URL: http://orders:8080
  GATEWAY_DEADLINE_S: "3"
