# The only manifest applied by hand. It points Argo CD at platform/apps, which declares every
# other component (app-of-apps). Rebuilding the platform = install Argo CD + apply this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab:8929/root/platform-gitops.git
    targetRevision: main
    path: platform/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
