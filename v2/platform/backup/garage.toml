# Garage (S3-compatible object store) for the backups of chapter 8 (E7): one node, one copy.
# Runs outside the cluster (container backup-s3 on the Docker network kind-ent, data in the Docker
# volume backup-s3-data): it survives the loss of the whole cluster. [模拟] "off-site" - it shares
# the host with the cluster; production keeps backups in another failure domain (region/account).
# Secrets are files from ~/.lab-secrets/v2/backup, mounted read-only (never in Git).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# sqlite instead of the default LMDB: slower, but survives an unclean stop of the WSL VM
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/rpc_secret"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/run/secrets/admin_token"
metrics_token_file = "/run/secrets/metrics_token"
