<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#638391"/></marker></defs><rect width="640" height="420" fill="white"/>
<text x="16" y="25" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="start" font-weight="600">先保住本地原子性，再面对跨系统的失败窗口</text>
<rect x="12" y="47" width="616" height="103" rx="5" fill="#eff7f3" stroke="#87b7a6" stroke-dasharray="5 4"/>
<text x="25" y="69" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#19796d" text-anchor="start" font-weight="600">① 同一个PostgreSQL事务</text>
<rect x="28" y="82" width="245" height="56" rx="5" fill="#edf5f7" stroke="#a6c4cf"/>
<text x="150.5" y="106" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="600">订单变为CONFIRMED</text>
<rect x="367" y="82" width="245" height="56" rx="5" fill="#edf5f7" stroke="#a6c4cf"/>
<text x="489.5" y="106" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="600">插入Outbox事件行</text>
<polyline points="273,110 367,110" fill="none" stroke="#638391" stroke-width="1.6" marker-end="url(#a)"/>
<text x="320" y="100" font-size="13" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">一起提交</text>
<rect x="16" y="191" width="184" height="82" rx="5" fill="#edf5f7" stroke="#a6c4cf"/>
<text x="108.0" y="215" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="600">② relay取行锁</text>
<text x="108.0" y="236" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">SKIP LOCKED</text>
<text x="108.0" y="257" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">读未发布事件</text>
<rect x="228" y="191" width="184" height="82" rx="5" fill="#edf5f7" stroke="#a6c4cf"/>
<text x="320.0" y="215" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="600">③ 发布到NATS</text>
<text x="320.0" y="236" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">稳定event_id</text>
<text x="320.0" y="257" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">等待发布应答</text>
<rect x="440" y="191" width="184" height="82" rx="5" fill="#edf5f7" stroke="#a6c4cf"/>
<text x="532.0" y="215" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="600">④ 标记已发布</text>
<text x="532.0" y="236" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">更新published_at</text>
<text x="532.0" y="257" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">随数据库事务提交</text>
<polyline points="488,150 488,170 108,170 108,191" fill="none" stroke="#638391" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="200,231 228,231" fill="none" stroke="#638391" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="412,231 440,231" fill="none" stroke="#638391" stroke-width="1.6" marker-end="url(#a)"/>
<text x="320" y="300" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#9a6226" text-anchor="middle" font-weight="600">③成功、④未提交就崩溃 → 再次发布同一事件</text>
<rect x="16" y="324" width="608" height="70" rx="5" fill="#fff5e8" stroke="#d6b787"/>
<text x="320.0" y="348" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="600">⑤ 消费：查去重 → 模拟副作用 → 写标记 → ACK</text>
<text x="320.0" y="369" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#203345" text-anchor="middle" font-weight="400">检查、外部效果与标记不原子；不能推出任意副作用恰好一次</text></svg>
