<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 206" width="640" height="206" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10.0" y="28.0" width="76.0" height="50.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="48.0" y="49.8" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">调用方</text>
<text x="48.0" y="63.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">例如 orders</text>
<rect x="110.0" y="14.0" width="126.0" height="78.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="173.0" y="43.0" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">隔舱</text>
<text x="173.0" y="56.6" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">在途调用太多了吗？</text>
<text x="173.0" y="70.2" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">上限 64</text>
<rect x="260.0" y="14.0" width="126.0" height="78.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="323.0" y="43.0" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">熔断器</text>
<text x="323.0" y="56.6" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">对方最近一直失败吗？</text>
<text x="323.0" y="70.2" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">是：立即拒绝</text>
<rect x="410.0" y="14.0" width="126.0" height="78.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="473.0" y="36.4" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">超时与截止时间</text>
<text x="473.0" y="49.9" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">这一次最多等多久？</text>
<text x="473.0" y="63.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">1 秒，且不超过</text>
<text x="473.0" y="76.8" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">上游的剩余时间</text>
<rect x="560.0" y="28.0" width="72.0" height="50.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="596.0" y="49.8" font-size="10" fill="#7a1f16" text-anchor="middle" font-weight="600">被调用方</text>
<text x="596.0" y="63.4" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">inventory</text>
<polyline points="86.0,53.0 105.0,53.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="110.0,53.0 101.1,49.0 101.1,57.0" fill="#5b6776"/>
<polyline points="236.0,53.0 255.0,53.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="260.0,53.0 251.1,49.0 251.1,57.0" fill="#5b6776"/>
<polyline points="386.0,53.0 405.0,53.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="410.0,53.0 401.1,49.0 401.1,57.0" fill="#5b6776"/>
<polyline points="536.0,53.0 555.0,53.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="560.0,53.0 551.1,49.0 551.1,57.0" fill="#5b6776"/>
<rect x="404.0" y="136.0" width="180.0" height="56.0" rx="5.0" fill="#fff4e0" stroke="#d9730d" stroke-width="1.2"/>
<text x="494.0" y="154.0" font-size="10" fill="#6b3b05" text-anchor="middle" font-weight="600">重试 + 重试预算</text>
<text x="494.0" y="167.6" font-size="9.5" fill="#6b3b05" text-anchor="middle" font-weight="normal">值得再试吗？</text>
<text x="494.0" y="181.2" font-size="9.5" fill="#6b3b05" text-anchor="middle" font-weight="normal">重试总量不超过 20%</text>
<polyline points="596.0,78.0 596.0,164.0 589.0,164.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="584.0,164.0 592.9,168.0 592.9,160.0" fill="#5b6776"/>
<rect x="538.5" y="105.5" width="53.5" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="589.0" y="114.0" font-size="9.5" fill="#5b6776" text-anchor="end" font-weight="normal">失败或超时</text>
<polyline points="404.0,164.0 323.0,164.0 323.0,97.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="323.0,92.0 319.0,100.9 327.0,100.9" fill="#5b6776"/>
<rect x="328.0" y="117.5" width="63.0" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="331.0" y="126.0" font-size="9.5" fill="#5b6776" text-anchor="start" font-weight="normal">带抖动的退避</text>
<rect x="328.0" y="130.0" width="44.0" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="331.0" y="138.5" font-size="9.5" fill="#5b6776" text-anchor="start" font-weight="normal">之后再试</text>
<rect x="10.0" y="128.0" width="260.0" height="64.0" rx="5.0" fill="#fffbe6" stroke="#d4b106" stroke-width="1.2"/>
<text x="140.0" y="150.0" font-size="10" fill="#5c4a00" text-anchor="middle" font-weight="600">naive 模式（本章的对照）</text>
<text x="140.0" y="163.6" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">去掉隔舱、熔断器和重试预算，</text>
<text x="140.0" y="177.2" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">超时放宽到 30 秒，失败立即重试 3 次</text>
</svg>
