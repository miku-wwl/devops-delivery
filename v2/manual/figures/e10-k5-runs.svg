<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">K5 的七次运行：洪水期间受害者成功请求的 p99（毫秒，对数刻度）</text>
<line x1="241.3" y1="34.0" x2="241.3" y2="242.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="241.3" y="257.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">10</text>
<line x1="354.3" y1="34.0" x2="354.3" y2="242.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="354.3" y="257.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">100</text>
<line x1="467.2" y1="34.0" x2="467.2" y2="242.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="467.2" y="257.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">1000</text>
<line x1="580.1" y1="34.0" x2="580.1" y2="242.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="580.1" y="257.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">10 000</text>
<text x="233.3" y="51.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">1  原始设计，无内存上限 · 虚拟机冻结</text>
<rect x="241.3" y="39.0" width="340.7" height="16.0" fill="#c0392b" stroke="none" stroke-width="1" rx="2"/>
<text x="588.0" y="51.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">10.4 s（安静时 42.8 ms）</text>
<text x="233.3" y="77.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">2  加内存上限，但 APF 被关闭 · 被杀 8 次</text>
<rect x="241.3" y="65.0" width="261.8" height="16.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="509.1" y="77.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">2081 ms（40.1 ms）</text>
<text x="233.3" y="103.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">3  APF 开启，1536 MiB · 被杀 6 次</text>
<rect x="241.3" y="91.0" width="151.4" height="16.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="398.7" y="103.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">219 ms（19.4 ms）</text>
<text x="233.3" y="129.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">4  加 GOMEMLIMIT · 被杀 4 次</text>
<rect x="241.3" y="117.0" width="254.7" height="16.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="502.0" y="129.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1800 ms（19.4 ms）</text>
<text x="233.3" y="155.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">5  Pod 减半 · 被杀 8 次</text>
<rect x="241.3" y="143.0" width="241.9" height="16.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="489.2" y="155.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1387 ms（15.6 ms）</text>
<text x="233.3" y="181.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">6a 借用上限为 0，3 个席位 · 被杀 5 次</text>
<rect x="241.3" y="169.0" width="185.2" height="16.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="432.6" y="181.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">437 ms（20.7 ms）</text>
<text x="233.3" y="207.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">6b 不限借用，7 个席位 · 被杀 8 次</text>
<rect x="241.3" y="195.0" width="247.0" height="16.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="494.4" y="207.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1540 ms（14.7 ms）</text>
<text x="233.3" y="233.0" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">7  3 个席位，2560 MiB · 被杀 1 次</text>
<rect x="241.3" y="221.0" width="145.4" height="16.0" fill="#0f8a7e" stroke="none" stroke-width="1" rx="2"/>
<text x="392.8" y="233.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">194 ms（20.3 ms）</text>
<line x1="309.3" y1="30.0" x2="309.3" y2="242.0" stroke="#2e8b57" stroke-width="1.3" stroke-dasharray="5 3"/>
<rect x="310.3" y="33.0" width="132.5" height="14.0" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="313.3" y="42.0" font-size="10" fill="#2e8b57" text-anchor="start" font-weight="normal">目标：不超过安静值的 2 倍</text>
<line x1="241.3" y1="34.0" x2="241.3" y2="242.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="437.7" y="273.0" font-size="10.5" fill="#5b6776" text-anchor="middle" font-weight="normal">受害者 GET 的 p99，毫秒；假设 K5 的目标线是安静值的 2 倍（约 40 ms）</text>
</svg>
