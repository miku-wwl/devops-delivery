<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">K5 的七次运行：洪水期间受害者成功请求的 p99（毫秒，对数刻度）</text>
<line x1="241.3" y1="34.0" x2="241.3" y2="250.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="241.3" y="265.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">10</text>
<line x1="331.3" y1="34.0" x2="331.3" y2="250.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="331.3" y="265.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">100</text>
<line x1="421.2" y1="34.0" x2="421.2" y2="250.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="421.2" y="265.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">1000</text>
<line x1="511.1" y1="34.0" x2="511.1" y2="250.0" stroke="#e6ebf0" stroke-width="1.0"/>
<text x="511.1" y="265.0" font-size="10" fill="#5b6776" text-anchor="middle" font-weight="normal">10 000</text>
<text x="233.3" y="51.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">1  原始设计，无内存上限 · 虚拟机冻结</text>
<rect x="241.3" y="39.0" width="271.3" height="17.0" fill="#c0392b" stroke="none" stroke-width="1" rx="2"/>
<text x="518.6" y="51.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">10.4 s（安静时 42.8 ms）</text>
<text x="233.3" y="78.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">2  加内存上限，但 APF 被关闭 · 被杀 8 次</text>
<rect x="241.3" y="66.0" width="208.5" height="17.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="455.8" y="78.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">2081 ms（40.1 ms）</text>
<text x="233.3" y="105.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">3  APF 开启，1536 MiB · 被杀 6 次</text>
<rect x="241.3" y="93.0" width="120.5" height="17.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="367.9" y="105.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">219 ms（19.4 ms）</text>
<text x="233.3" y="132.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">4  加 GOMEMLIMIT · 被杀 4 次</text>
<rect x="241.3" y="120.0" width="202.8" height="17.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="450.1" y="132.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1800 ms（19.4 ms）</text>
<text x="233.3" y="159.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">5  Pod 减半 · 被杀 8 次</text>
<rect x="241.3" y="147.0" width="192.6" height="17.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="440.0" y="159.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1387 ms（15.6 ms）</text>
<text x="233.3" y="186.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">6a 借用上限为 0，3 个席位 · 被杀 5 次</text>
<rect x="241.3" y="174.0" width="147.5" height="17.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="394.9" y="186.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">437 ms（20.7 ms）</text>
<text x="233.3" y="213.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">6b 不限借用，7 个席位 · 被杀 8 次</text>
<rect x="241.3" y="201.0" width="196.7" height="17.0" fill="#d9730d" stroke="none" stroke-width="1" rx="2"/>
<text x="444.0" y="213.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">1540 ms（14.7 ms）</text>
<text x="233.3" y="240.5" font-size="10.5" fill="#1b2430" text-anchor="end" font-weight="normal">7  3 个席位，2560 MiB · 被杀 1 次</text>
<rect x="241.3" y="228.0" width="115.8" height="17.0" fill="#0f8a7e" stroke="none" stroke-width="1" rx="2"/>
<text x="363.1" y="240.5" font-size="10" fill="#1b2430" text-anchor="start" font-weight="normal">194 ms（20.3 ms）</text>
<line x1="295.5" y1="30.0" x2="295.5" y2="250.0" stroke="#2e8b57" stroke-width="1.3" stroke-dasharray="5 3"/>
<rect x="296.5" y="33.0" width="132.5" height="14.0" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="299.5" y="42.0" font-size="10" fill="#2e8b57" text-anchor="start" font-weight="normal">目标：不超过安静值的 2 倍</text>
<line x1="241.3" y1="34.0" x2="241.3" y2="250.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="397.7" y="281.0" font-size="10.5" fill="#5b6776" text-anchor="middle" font-weight="normal">受害者 GET 的 p99，毫秒；假设 K5 的目标线是安静值的 2 倍（约 40 ms）</text>
</svg>
