name: release
# Supply-chain pipeline for the demo-api image (roadmap module D5):
#   build -> Trivy gate (before anything is pushed) -> push to GHCR by digest
#   -> SBOM (SPDX, Syft) -> GitHub artifact attestations (build provenance + SBOM)
#   -> Cosign keyless signature (GitHub OIDC -> Fulcio certificate -> Rekor log)
#   -> verify signature and attestations exactly as a consumer would.
# Runs for main and, in this lab, for p5/** branches (merges to main are owner-reviewed).

on:
  push:
    branches: [main, "p[0-9]*/**"]  # lab: phase branches (main merges are owner-reviewed)
    paths:
      - app/**
      - automation/ci/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/demo-api

jobs:
  release:
    name: build, scan, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to ghcr.io with GITHUB_TOKEN
      id-token: write      # OIDC token for keyless signing and attestations
      attestations: write  # store attestations in the repository
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build for scanning (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: demo-api:scan
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Install Trivy (pinned, checksum-verified)
        run: bash automation/ci/install-trivy.sh
      - name: Trivy gate - an image with fixable HIGH/CRITICAL vulnerabilities is never pushed
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 demo-api:scan

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (same inputs as the scanned build - every layer comes from the cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          provenance: false  # provenance is attested by GitHub below
          sbom: false        # the SBOM is generated and attested below
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release

      - name: SBOM (SPDX JSON, generated by Syft from the pushed image)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Attest build provenance (SLSA provenance, signed via Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        # actions/attest-sbom is deprecated in favour of actions/attest (same inputs).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Cosign keyless signature (identity = this workflow, via GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature and attestations like a consumer would
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            | jq -c '.[0] | {image: .critical.image, issuer: .optional.Issuer, subject: .optional.Subject}'
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### demo-api image published"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Verify:"
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
