name: synthetic-gate
# Pre-release synthetic test (roadmap module D9, open-source variant):
#   build the candidate image -> throwaway Kind cluster in CI -> install the Helm chart
#   -> k6 synthetic API journeys with pass/fail thresholds -> tear down.
# Called by release.yml before anything is pushed or signed; a failed threshold fails
# this job and the release job (which "needs" it) is skipped.
# workflow_dispatch lets you inject a fault on purpose to watch the gate block.

on:
  workflow_call:
    inputs:
      fault:
        description: "Inject a fault through chart values (none | latency | errors)"
        type: string
        default: none
  workflow_dispatch:
    inputs:
      fault:
        description: "Inject a fault through chart values"
        type: choice
        options: [none, latency, errors]
        default: none

permissions:
  contents: read

jobs:
  synthetic:
    name: synthetic API test (kind + k6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind, kubectl, helm, k6 (pinned, checksum-verified)
        run: |
          bash automation/ci/install-gate-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: demo-api:candidate
          build-args: |
            APP_VERSION=gate-${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=demo-api
          cache-to: type=gha,mode=max,scope=demo-api

      - name: Create a throwaway Kind cluster and load the candidate
        run: |
          KIND_NODE_IMAGE="$(grep -E '^KIND_NODE_IMAGE=' automation/lab/versions.env | cut -d= -f2- | tr -d '\r')"
          kind create cluster --name gate --image "$KIND_NODE_IMAGE" --wait 120s
          kind load docker-image demo-api:candidate --name gate
          kubectl get nodes -o wide

      - name: Synthetic gate
        env:
          FAULT: ${{ inputs.fault || 'none' }}
        run: bash synthetic/run-gate.sh --image demo-api --tag candidate --fault "$FAULT" --summary-dir out

      - name: Job summary
        if: always()
        run: |
          if [ -f out/k6-summary.md ]; then cat out/k6-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-gate-k6-summary
          path: out/
          if-no-files-found: ignore
