name: ci
# Pull-request quality gate for app/ (demo-api):
#   python / lint      ruff lint + format check          (reusable workflow)
#   python / test      pytest + coverage threshold        (reusable workflow)
#   container image    docker build with layer cache, Trivy image gate, smoke test
#   security           Trivy repository scan (dependencies, secrets, misconfigurations)
# python / lint, python / test and container image are required by the
# "protect-main" ruleset; add "security" once this workflow version is on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      working-directory: app
      python-version: "3.13"

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (pinned, checksum-verified)
        run: bash automation/ci/install-trivy.sh
      - name: Trivy repository scan - dependencies, leaked secrets, IaC misconfigurations
        # manual/ holds build tooling for the PDF manual; it is not shipped.
        run: >-
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --skip-dirs manual .

  image:
    name: container image
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (GitHub Actions cache backend)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: demo-api:ci
          build-args: |
            APP_VERSION=ci-${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=demo-api
          cache-to: type=gha,mode=max,scope=demo-api
      - name: Install Trivy (pinned, checksum-verified)
        run: bash automation/ci/install-trivy.sh
      - name: Trivy image scan - block fixable HIGH/CRITICAL vulnerabilities
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 demo-api:ci
      - name: Smoke test the container
        run: |
          docker run -d --name demo-api -p 8080:8080 demo-api:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/v1/info
          curl -fsS -X POST localhost:8080/api/v1/orders \
            -H 'content-type: application/json' -d '{"sku":"BOOK-001","quantity":1}'
          test "$(docker inspect -f '{{.Config.User}}' demo-api:ci)" = "10001"
      - name: Container logs
        if: always()
        run: docker logs demo-api || true
