# Admission control: in dev and prod, a Pod may only run images that carry a SLSA
# build-provenance attestation signed by this repository's release workflow
# (GitHub artifact attestation = Sigstore bundle, keyless via GitHub OIDC, in Rekor).
# Kyverno also rewrites image tags to the verified digest (mutateDigest).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-release-signature
  annotations:
    policies.kyverno.io/title: Only run images built and attested by the demo-api release workflow
    policies.kyverno.io/description: >-
      Every container image in the dev and prod namespaces must have a SLSA v1
      provenance attestation whose signing certificate identity is release.yml of
      miku-wwl/devops-delivery, issued by the GitHub Actions OIDC provider.
spec:
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: require-release-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [dev, prod]
      verifyImages:
        - imageReferences: ["*"]
          # GitHub artifact attestations and Cosign v3 signatures are Sigstore
          # bundles, not the legacy "sha256-<digest>.sig" tags.
          type: SigstoreBundle
          failureAction: Enforce
          mutateDigest: true
          verifyDigest: true
          required: true
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        # A regular expression, not a "*" wildcard: the wildcard did not
                        # match identities such as "...release.yml@refs/heads/p5/supply-chain".
                        subjectRegExp: '^https://github\.com/miku-wwl/devops-delivery/\.github/workflows/release\.yml@refs/heads/.+$'
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
