# Kind cluster for P3-P10: one control-plane node and two workers.
# Node images from kind v0.27+ already configure containerd to read registry hosts
# from /etc/containerd/certs.d, so no containerdConfigPatches are needed; the
# create-lab-cluster.sh script writes the hosts.toml for the local registry.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
  - role: worker
  - role: worker
