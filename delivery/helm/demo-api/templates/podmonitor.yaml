{{- if .Values.podMonitor.enabled }}
# Prometheus Operator scrapes /metrics of every demo-api pod. podTargetLabels copies
# pod labels onto every series, so queries can select the canary ReplicaSet.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "demo-api.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
  podTargetLabels:
    - rollouts-pod-template-hash
    - role
    - environment
{{- end }}
