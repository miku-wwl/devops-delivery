{{- if .Values.rollout.enabled }}
# Argo Rollouts canary: replaces the Deployment when rollout.enabled is true.
# Without a traffic router the canary weight is approximated with replica counts.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "demo-api.selectorLabels" . | nindent 6 }}
  template:
    {{- include "demo-api.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      # Extra pod labels so metrics can be told apart (see podmonitor.yaml).
      canaryMetadata:
        labels:
          role: canary
      stableMetadata:
        labels:
          role: stable
      {{- if .Values.rollout.analysis.enabled }}
      # Background analysis: runs from step 1 until the rollout finishes; a failed
      # AnalysisRun aborts the rollout and scales the canary back to zero.
      analysis:
        templates:
          - templateName: {{ include "demo-api.fullname" . }}-health
        startingStep: 1
        args:
          - name: namespace
            value: {{ .Release.Namespace }}
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      {{- end }}
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
{{- end }}
