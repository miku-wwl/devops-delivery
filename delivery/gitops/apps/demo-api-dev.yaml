# dev: fully automatic - every commit is synced, manual drift is reverted (selfHeal).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # deleting the Application deletes its resources
spec:
  project: delivery
  source:
    repoURL: http://gitlab:8929/root/delivery-gitops.git
    targetRevision: main
    path: charts/demo-api
    helm:
      releaseName: demo-api-dev
      valueFiles:
        - values-dev.yaml              # chart-level defaults for dev
        - ../../envs/dev/values.yaml   # deployment state (image) for dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true     # objects removed from Git are removed from the cluster
      selfHeal: true  # manual changes in the cluster are reverted to Git
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
